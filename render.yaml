services:
  - type: web
    name: dse-market-signal
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # Lowest latency for Bangladesh / South Asia
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: TZ
        value: Asia/Dhaka
      - key: LOG_LEVEL
        value: INFO
