version: '3.8'

services:
  dse-market-signal:
    build:
      context: .
      dockerfile: Dockerfile
    image: dse-market-signal:latest
    container_name: dse-market-signal-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Dhaka
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
